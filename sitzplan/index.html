<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sitzplan · Hochzeit</title>
<style>
  :root {
    --bg: #0e0e12;
    --bg-2: #16161d;
    --panel: #1b1b23;
    --panel-2: #20202a;
    --line: #2c2c38;
    --line-soft: #24242e;
    --gold: #c8a76a;
    --gold-soft: #d8bd86;
    --gold-dim: #8a7445;
    --wood: #93702f;
    --wood-light: #a9853f;
    --green: #1f4d44;
    --green-line: #2f7163;
    --text: #ece8df;
    --text-dim: #9a968d;
    --text-faint: #6a675f;
    --empty: #3a3a46;
    --danger: #c66;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, #1a1a24 0%, transparent 60%),
      radial-gradient(1000px 700px at 100% 0%, #161620 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }

  .wrap { max-width: 1640px; margin: 0 auto; padding: 22px 22px 60px; }

  /* ---------- Header ---------- */
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .title { display: flex; align-items: center; gap: 14px; }
  .title .crest {
    width: 42px; height: 42px; border-radius: 12px;
    display: grid; place-items: center;
    background: linear-gradient(160deg, #2a2a36, #15151c);
    border: 1px solid var(--line); color: var(--gold); font-size: 20px;
  }
  .title h1 { font-size: 30px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .title h1 .dot { color: var(--gold); margin: 0 8px; }
  .title .sub { color: var(--text-dim); }

  .stats { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
  .stats b { color: var(--text); font-weight: 600; }
  .stats .open { color: var(--gold-soft); }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg {
    display: inline-flex; align-items: center; gap: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 5px;
  }
  .seg button, .btn {
    background: transparent; color: var(--text); border: none; cursor: pointer;
    font-size: 14px; border-radius: 8px; padding: 7px 11px; line-height: 1;
    display: inline-flex; align-items: center; gap: 7px; transition: background .15s, color .15s;
  }
  .seg button:hover, .btn:hover { background: var(--panel-2); }
  .seg .zoom-val { min-width: 46px; text-align: center; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .btn.outline { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; }
  .btn.outline:hover { border-color: var(--gold-dim); }
  .day-tabs { display: inline-flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 5px; }
  .day-tabs button { padding: 7px 14px; border-radius: 8px; color: var(--text-dim); }
  .day-tabs button.active { background: var(--gold); color: #1a1408; font-weight: 600; }

  /* ---------- Hint bar ---------- */
  .hint {
    display: none; align-items: center; gap: 12px; justify-content: space-between;
    background: linear-gradient(180deg, rgba(200,167,106,.10), rgba(200,167,106,.04));
    border: 1px solid rgba(200,167,106,.35);
    border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; color: var(--gold-soft);
  }
  .hint.show { display: flex; }
  .hint .x { color: var(--gold-soft); background: transparent; border: none; cursor: pointer; font-size: 14px; padding: 6px 10px; border-radius: 8px; }
  .hint .x:hover { background: rgba(200,167,106,.12); }

  /* ---------- Pool ---------- */
  .pool {
    border: 1px dashed var(--line); border-radius: 18px; padding: 18px 18px 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.012), transparent);
    margin-bottom: 22px;
  }
  .pool.dropring { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,167,106,.15) inset; }
  .pool-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .pool-head h2 { font-size: 19px; margin: 0; color: var(--gold-soft); font-weight: 600; }
  .search {
    display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; min-width: 220px;
  }
  .search input { background: transparent; border: none; color: var(--text); outline: none; font-size: 14px; width: 100%; }
  .search input::placeholder { color: var(--text-faint); }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px 6px 6px; cursor: grab; user-select: none;
    transition: transform .08s, border-color .15s, background .15s; touch-action: none;
  }
  .chip:hover { border-color: var(--gold-dim); background: var(--panel-2); }
  .chip.selected { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(200,167,106,.25); }
  .chip .name { font-size: 14px; white-space: nowrap; }
  .chip.hidden { display: none; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    color: #11110c; letter-spacing: .3px;
  }

  /* ---------- Stage ---------- */
  .stage-frame {
    border: 1px solid var(--line); border-radius: 22px; background:
      radial-gradient(900px 500px at 50% 0%, rgba(255,255,255,.02), transparent 60%),
      var(--bg-2);
    padding: 26px; overflow: auto; box-shadow: var(--shadow);
  }
  .stage-scroll { overflow: auto; }
  .stage {
    position: relative; transform-origin: top left; transition: transform .12s ease;
    margin: 0 auto;
  }

  .zone {
    position: absolute; border-radius: 16px; pointer-events: none;
  }
  .zone.wintergarten { border: 1px solid var(--green-line); background: rgba(31,77,68,.18); }
  .zone-label {
    position: absolute; font-size: 12px; letter-spacing: 3px; color: var(--text-faint);
    text-transform: uppercase; pointer-events: none;
  }

  .deco {
    position: absolute; display: grid; place-items: center; pointer-events: none;
    letter-spacing: 4px; font-size: 13px; text-transform: uppercase;
  }
  .deco.bar { background: linear-gradient(180deg, #20202a, #191921); border: 1px solid var(--line); border-radius: 14px; color: var(--text-dim); }
  .deco.eingang { background: #191921; border: 1px solid var(--line); border-radius: 12px; color: var(--text-dim); writing-mode: vertical-rl; }
  .deco.baum {
    border-radius: 50%; color: #9fc9bd;
    background: radial-gradient(circle at 38% 32%, #2c6e60, #173e37 70%);
    border: 1px solid var(--green-line); font-size: 12px; letter-spacing: 4px;
  }

  .table {
    position: absolute; border-radius: 12px;
    background: linear-gradient(170deg, var(--wood-light), var(--wood));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 8px 18px rgba(0,0,0,.35);
    display: grid; place-items: center; pointer-events: none;
  }
  .table .tlabel { color: #2b2207; font-weight: 700; font-size: 13px; letter-spacing: .5px; opacity: .85; }
  .table-cap {
    position: absolute; text-align: center; color: var(--text-faint); font-size: 12px;
    width: 240px; pointer-events: none;
  }

  .seat {
    position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
    display: grid; place-items: center; cursor: pointer; user-select: none;
    border: 1.5px dashed var(--empty); color: var(--text-faint);
    background: rgba(255,255,255,.015); font-size: 12px; font-variant-numeric: tabular-nums;
    transition: border-color .12s, box-shadow .12s, background .12s, transform .08s;
    touch-action: none;
  }
  .seat:hover { border-color: var(--gold-dim); }
  .seat.occupied {
    border-style: solid; border-color: transparent; cursor: grab; padding: 2px;
  }
  .seat.occupied .seat-av {
    width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; color: #11110c; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .seat.target { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,167,106,.30); background: rgba(200,167,106,.10); }
  .seat.selected { box-shadow: 0 0 0 3px rgba(200,167,106,.45); }
  .seat .seat-name {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    margin-top: 3px; font-size: 10px; color: var(--text); white-space: nowrap;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }

  /* drag ghost */
  .ghost {
    position: fixed; z-index: 9999; pointer-events: none; left: 0; top: 0;
    display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px 6px 6px;
    background: var(--panel-2); border: 1px solid var(--gold); border-radius: 999px;
    box-shadow: 0 12px 30px rgba(0,0,0,.5); opacity: .96; transform: translate(-50%, -50%);
    font-size: 14px;
  }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 12px; box-shadow: var(--shadow); font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 9998;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* table fill badges */
  .table-badge {
    position: absolute; font-size: 11px; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 9px; pointer-events: none; font-variant-numeric: tabular-nums;
  }

  @media print {
    body { background: #fff; color: #000; }
    .wrap { max-width: none; }
    header.top .controls, .pool, .hint, .search { display: none !important; }
    .stage-frame { border: none; box-shadow: none; background: #fff; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="title">
        <div class="crest serif">❦</div>
        <h1 class="serif">Sitzplan <span class="dot">·</span> <span class="sub" id="dayName">Samstag</span></h1>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="controls">
      <div class="seg">
        <button id="zoomOut" title="Verkleinern">−</button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button id="zoomIn" title="Vergrößern">+</button>
        <button id="zoomFit" title="Einpassen">⤢</button>
      </div>
      <button class="btn outline" id="printBtn">⎙ Drucken / PDF</button>
      <button class="btn outline" id="resetBtn">↺ Reset</button>
    </div>
  </header>

  <div class="hint" id="hint">
    <span id="hintText"></span>
    <button class="x" id="hintCancel">Abbrechen</button>
  </div>

  <section class="pool" id="pool">
    <div class="pool-head">
      <h2 id="poolTitle">Noch nicht platziert</h2>
      <div class="search">
        <span style="color:var(--text-faint)">⌕</span>
        <input id="search" type="text" placeholder="Gast suchen…" autocomplete="off" />
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <div class="stage-frame">
    <div class="stage-scroll">
      <div class="stage" id="stage"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
